name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Read app version
        id: app_version
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          if [ -z "$version_name" ]; then
            echo "versionName was not found in app/build.gradle" >&2
            exit 1
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          HOSHIMI_RELEASE_KEYSTORE_BASE64: ${{ secrets.HOSHIMI_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HOSHIMI_RELEASE_KEYSTORE_BASE64" ]; then
            echo "$HOSHIMI_RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          fi

      - name: Build full and lite APKs
        env:
          HOSHIMI_RELEASE_STORE_FILE: release.keystore
          HOSHIMI_RELEASE_STORE_PASSWORD: ${{ secrets.HOSHIMI_RELEASE_STORE_PASSWORD }}
          HOSHIMI_RELEASE_KEY_ALIAS: ${{ secrets.HOSHIMI_RELEASE_KEY_ALIAS }}
          HOSHIMI_RELEASE_KEY_PASSWORD: ${{ secrets.HOSHIMI_RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/hoshimi-apks"
          ./gradlew clean assembleRelease
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/hoshimi-apks/HoshimiLocalify_${{ steps.app_version.outputs.version_name }}_full.apk"
          ./gradlew clean assembleRelease -Plite=true
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/hoshimi-apks/HoshimiLocalify_${{ steps.app_version.outputs.version_name }}_lite.apk"

      - name: Verify packaged translation data
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          directory = Path(os.environ["RUNNER_TEMP"]) / "hoshimi-apks"
          full, = directory.glob("HoshimiLocalify_v*_full.apk")
          lite, = directory.glob("HoshimiLocalify_v*_lite.apk")
          with ZipFile(full) as apk:
              assert "assets/hoshimi-local/version.txt" in apk.namelist(), "Full APK has no translation version"
              assert any(name.startswith("assets/hoshimi-local/local-files/") for name in apk.namelist()), "Full APK has no translation data"
          with ZipFile(lite) as apk:
              assert not any(name.startswith("assets/hoshimi-local/") for name in apk.namelist()), "Lite APK contains translation data"
          PY

      - name: Create or update version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tag_name="${{ steps.app_version.outputs.version_name }}"

          git fetch --tags
          git tag -f "$tag_name" "$GITHUB_SHA"
          git push -f origin "$tag_name"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_name="${{ steps.app_version.outputs.version_name }}"
          full_apk="$RUNNER_TEMP/hoshimi-apks/HoshimiLocalify_${{ steps.app_version.outputs.version_name }}_full.apk"
          lite_apk="$RUNNER_TEMP/hoshimi-apks/HoshimiLocalify_${{ steps.app_version.outputs.version_name }}_lite.apk"

          gh release view "$tag_name" >/dev/null 2>&1 || \
            gh release create "$tag_name" \
              --title "$tag_name" \
              --notes ""

          gh release upload "$tag_name" "$full_apk" "$lite_apk" --clobber

          assets="$(gh release view "$tag_name" --json assets --jq '.assets[].name')"
          while IFS= read -r asset; do
            case "$asset" in
              "${full_apk##*/}"|"${lite_apk##*/}") ;;
              HoshimiLocalify_v*.apk|HoshimiLite_v*.apk)
                gh release delete-asset "$tag_name" "$asset" --yes
                ;;
            esac
          done <<< "$assets"

